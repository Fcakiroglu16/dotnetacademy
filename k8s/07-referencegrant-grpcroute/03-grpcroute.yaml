# gRPC over the HTTPS listener (TLS + HTTP/2 via ALPN). Rules match gRPC service and method names.
# Core support is an Exact match with both service and method, so every method is listed.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: fleet-telemetry
  namespace: pedalshare-fleet
spec:
  parentRefs:
  - name: public
    namespace: pedalshare-infra
    sectionName: https
  hostnames:
  - fleet.pedalshare.local
  rules:
  # Bikes report pings; the fleet dashboard reads a bike's last state.
  - matches:
    - method: {service: pedalshare.telemetry.v1.FleetTelemetry, method: ReportPing}
    - method: {service: pedalshare.telemetry.v1.FleetTelemetry, method: GetBikeStatus}
    backendRefs:
    - {name: fleet-telemetry, port: 80}
  # Server reflection, so tools like grpcurl can list services without the .proto file.
  - matches:
    - method: {service: grpc.reflection.v1.ServerReflection, method: ServerReflectionInfo}
    - method: {service: grpc.reflection.v1alpha.ServerReflection, method: ServerReflectionInfo}
    backendRefs:
    - {name: fleet-telemetry, port: 80}
