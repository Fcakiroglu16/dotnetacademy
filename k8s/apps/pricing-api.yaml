# PedalShare pricing team: two versions of the fare calculator run side by side.
apiVersion: v1
kind: Namespace
metadata:
  name: pedalshare-pricing
  labels:
    pedalshare.io/edge-access: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-api-v1
  namespace: pedalshare-pricing
spec:
  replicas: 3
  selector:
    matchLabels: {app: pricing-api, version: v1}
  template:
    metadata:
      labels: {app: pricing-api, version: v1}
    spec:
      containers:
      - name: api
        image: pedalshare-api:1.0
        imagePullPolicy: IfNotPresent
        env:
        - {name: SERVICE_NAME, value: pricing-api}
        - {name: SERVICE_VERSION, value: v1}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-api-v1
  namespace: pedalshare-pricing
spec:
  selector: {app: pricing-api, version: v1}
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-api-v2
  namespace: pedalshare-pricing
spec:
  replicas: 3
  selector:
    matchLabels: {app: pricing-api, version: v2}
  template:
    metadata:
      labels: {app: pricing-api, version: v2}
    spec:
      containers:
      - name: api
        image: pedalshare-api:1.0
        imagePullPolicy: IfNotPresent
        env:
        - {name: SERVICE_NAME, value: pricing-api}
        - {name: SERVICE_VERSION, value: v2}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-api-v2
  namespace: pedalshare-pricing
spec:
  selector: {app: pricing-api, version: v2}
  ports:
  - port: 80
    targetPort: 8080
