# PedalShare stations API, owned by the stations team.
apiVersion: v1
kind: Namespace
metadata:
  name: pedalshare-stations
  labels:
    pedalshare.io/edge-access: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stations-api
  namespace: pedalshare-stations
spec:
  replicas: 2
  selector:
    matchLabels: {app: stations-api}
  template:
    metadata:
      labels: {app: stations-api}
    spec:
      containers:
      - name: api
        image: pedalshare-api:1.0
        imagePullPolicy: IfNotPresent
        env:
        - {name: SERVICE_NAME, value: stations-api}
        - {name: SERVICE_VERSION, value: v1}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: stations-api
  namespace: pedalshare-stations
spec:
  selector: {app: stations-api}
  ports:
  - port: 80
    targetPort: 8080
