# Same platform namespace, a second Gateway implemented by Traefik.
# Traefik listener ports are entryPoint ports inside the Traefik Pod (web = 8000), not Service ports.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-traefik
  namespace: pedalshare-infra
spec:
  gatewayClassName: traefik
  listeners:
  - name: http
    protocol: HTTP
    port: 8000
    hostname: "*.pedalshare.local"
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            pedalshare.io/edge-access: "true"
