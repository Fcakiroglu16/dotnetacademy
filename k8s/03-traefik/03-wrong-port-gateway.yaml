# Fails on Traefik: port 80 is the Service port, but listeners must use an entryPoint port (8000).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wrong-port
  namespace: pedalshare-infra
spec:
  gatewayClassName: traefik
  listeners:
  - name: http
    protocol: HTTP
    port: 80
