# Application developer: attaches a route to the shared Gateway from the team's own namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: pedalshare-stations
  labels:
    pedalshare.io/edge-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stations
  namespace: pedalshare-stations
spec:
  parentRefs:
  - name: public
    namespace: pedalshare-infra
    sectionName: http
  hostnames:
  - stations.pedalshare.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /stations
    backendRefs:
    - name: stations-api
      port: 80
