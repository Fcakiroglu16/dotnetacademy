apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stations
  namespace: pedalshare-stations
spec:
  parentRefs:
  - name: public
    namespace: pedalshare-infra
    sectionName: http
  hostnames:
  - stations.pedalshare.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /stations
    backendRefs:
    - name: stations-api
      port: 80
