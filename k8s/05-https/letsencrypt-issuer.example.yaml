# Production example (not applied in the lab): ACME HTTP-01 through the same Gateway.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: public
            namespace: pedalshare-infra
            sectionName: http
