# A private CA for the lab. In production, replace "pedalshare-ca" with an ACME (Let's Encrypt) issuer.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pedalshare-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: PedalShare Lab Root CA
  secretName: pedalshare-root-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: pedalshare-ca
spec:
  ca:
    secretName: pedalshare-root-ca   # read from the cert-manager namespace
