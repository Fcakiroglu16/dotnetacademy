# No cert-manager annotation and no Secret: the listener reports InvalidCertificateRef.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: no-cert
  namespace: pedalshare-infra
spec:
  gatewayClassName: nginx
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: does-not-exist
